name: Engineering portfolio checks
on:
  push:
    paths: ['projects/**', '.github/workflows/engineering-checks.yml']
  pull_request:
    paths: ['projects/**', '.github/workflows/engineering-checks.yml']
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/telco-signal/requirements.txt
      - run: python projects/run_checks.py
